name: CI

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: ruff check
        run: ruff check apps/ config/ tests/ manage.py

      - name: ruff format --check
        run: ruff format --check apps/ config/ tests/ manage.py

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vbb
          POSTGRES_PASSWORD: vbb_pass
          POSTGRES_DB: vbb_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vbb -d vbb_db" --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      SECRET_KEY: dummy-ci-secret
      POSTGRES_DB: vbb_db
      POSTGRES_USER: vbb
      POSTGRES_PASSWORD: vbb_pass
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do pg_isready -h 127.0.0.1 -p 5432 -U vbb -d vbb_db && break || sleep 1; done

      # Verifies migrations still apply cleanly on Postgres; the test suite
      # itself runs on in-memory SQLite (config.settings.test) via pytest.
      - name: Check migrations apply (Postgres)
        run: python manage.py migrate --noinput
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev

      - name: Run test suite
        run: pytest --cov=apps --cov-report=term-missing --cov-fail-under=85

  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      # Audit the pinned production dependencies ([project].dependencies).
      # This job is blocking: a known vulnerability fails the build. If a pin
      # ever has no fixed release, add `--ignore-vuln <ID>` with a comment
      # justifying it rather than making the job non-blocking.
      - name: Extract production dependencies
        run: |
          python - <<'EOF'
          import tomllib
          with open("pyproject.toml", "rb") as f:
              deps = tomllib.load(f)["project"]["dependencies"]
          with open("prod-requirements.txt", "w") as f:
              f.write("\n".join(deps) + "\n")
          EOF

      - name: pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit==2.10.1
          pip-audit --no-deps -r prod-requirements.txt

  docker-build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7

      - name: Build production image
        run: docker build --target prod -t vbb-backend:ci backend
