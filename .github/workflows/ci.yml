name: CI

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: flake8
        run: flake8 apps/ config/

      - name: black --check
        run: black --check apps/ config/

      - name: isort --check
        run: isort --check-only apps/ config/

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vbb
          POSTGRES_PASSWORD: vbb_pass
          POSTGRES_DB: vbb_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vbb -d vbb_db" --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      SECRET_KEY: dummy-ci-secret
      POSTGRES_DB: vbb_db
      POSTGRES_USER: vbb
      POSTGRES_PASSWORD: vbb_pass
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      DATABASE_URL: postgres://vbb:vbb_pass@127.0.0.1:5432/vbb_db

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do pg_isready -h 127.0.0.1 -p 5432 -U vbb -d vbb_db && break || sleep 1; done

      - name: Check migrations apply (Postgres)
        run: python manage.py migrate --noinput

      - name: Run test suite
        run: python manage.py test apps --verbosity 2

  docker-build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        run: docker build --target prod -t vbb-backend:ci .
