[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vbb-backend"
version = "0.1.0"
description = "Virtual Blood Bank backend"
requires-python = ">=3.12"
dependencies = [
  "Django==5.2.16",
  "django-allauth==65.14.1",
  "django-cors-headers==4.9.0",
  "django-environ==0.12.0",
  "django-extensions==4.1",
  "django-filter==25.2",
  "djangorestframework==3.16.1",
  "djangorestframework-simplejwt==5.5.1",
  "drf-nested-routers==0.95.0",
  "drf-spectacular[sidecar]==0.30.0",
  "drf-spectacular-sidecar==2026.7.1",
  "drf-standardized-errors[openapi]==0.16.0",
  "firebase-admin==7.5.0",
  "gunicorn==23.0.0",
  "psycopg==3.2.10",
  "psycopg-binary==3.2.10",
  "whitenoise==6.8.2",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "pytest-django==4.12.0",
  "pytest-cov==7.1.0",
  "ruff==0.16.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["apps*", "config*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
# Make `from tests.factories import ...` resolve when running from backend/.
pythonpath = ["."]
python_files = ["tests.py", "test_*.py", "*_test.py"]
testpaths = ["apps", "tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["apps"]
omit = ["*/migrations/*", "*/tests/*"]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["migrations"]
# Respect excludes even for files passed explicitly (e.g. by pre-commit).
force-exclude = true

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # pyflakes
  "I",  # isort
  "UP", # pyupgrade
  "B",  # flake8-bugbear
  "DJ", # flake8-django
]

[tool.ruff.lint.per-file-ignores]
# Settings modules use star imports by design.
"config/settings/*.py" = ["F403", "F405", "E501"]

[tool.ruff.lint.isort]
# Apps are imported without the `apps.` prefix (see sys.path insert in
# config/settings/base.py); `tests` holds the shared factories.
known-first-party = [
  "apps",
  "audit",
  "config",
  "core",
  "donations",
  "inventory",
  "notifications",
  "tests",
  "users",
]

[tool.ruff.format]
# Defaults match black.
