# Render Blueprint: https://render.com/docs/blueprint-spec
# Deploys the VBB backend as a Dockerfile web service + managed Postgres.
services:
  - type: web
    name: vbb-backend
    runtime: docker
    # The backend lives in ./backend; the Render blueprint stays at repo root.
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Build only the production stage of the multi-stage Dockerfile.
    dockerCommand: ./scripts/start.sh
    plan: free
    healthCheckPath: /healthz/
    autoDeploy: true
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: vbb-db
          property: connectionString
      # RENDER_EXTERNAL_HOSTNAME is injected automatically and added to
      # ALLOWED_HOSTS / CSRF_TRUSTED_ORIGINS by config/settings/prod.py.
      - key: WEB_CONCURRENCY
        value: "3"

databases:
  - name: vbb-db
    plan: free
    postgresMajorVersion: "16"
