[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vbb-backend"
version = "0.1.0"
description = "Virtual Blood Bank backend"
requires-python = ">=3.12"
dependencies = [
  "Django==5.2.7",
  "django-allauth==65.12.1",
  "django-environ==0.12.0",
  "django-extensions==4.1",
  "django-filter==25.2",
  "djangorestframework==3.16.1",
  "drf-nested-routers==0.95.0",
  "gunicorn==23.0.0",
  "psycopg==3.2.10",
  "psycopg-binary==3.2.10",
  "whitenoise==6.8.2",
]

[project.optional-dependencies]
dev = [
  "black==25.9.0",
  "flake8==7.3.0",
  "isort==7.0.0",
  "pytest==8.4.2",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["apps*", "config*"]

# Black Configuration
[tool.black]
line-length = 88
target-version = ['py312']
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | _build
  | buck-out
  | build
  | dist
  | migrations
)/
'''

# Isort Configuration
[tool.isort]
profile = "black"
line_length = 88
skip_glob = ["**/venv/*", "**/migrations/*"]

# Flake8 Configuration
[tool.flake8]
max-line-length = 88
extend-ignore = [
  "E203"
]
exclude = [
  ".git",
  "__pycache__",
  ".pytest_cache",
  "docker",
  "migrations",
  "venv",
  "src/venv",
]

[tool.pytest.ini_options]
python_files = ["tests.py", "test_*.py", "*_test.py"]
